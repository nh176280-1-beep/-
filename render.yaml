# 유료 서비스 및 영구 디스크입니다. Render가 표시하는 비용 확인 후 생성하세요.
services:
  - type: web
    name: daegu-meat-prices
    runtime: docker
    plan: starter
    healthCheckPath: /health
    autoDeployTrigger: off
    disk:
      name: price-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /app/data
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
